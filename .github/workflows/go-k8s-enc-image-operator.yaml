name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:

  test:
    env:
      GOSEC_VERSION: v2.30.0

    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'
        check-latest: true

    - run: go version

    - name: Install dependancies
      run: |
        sudo apt-get update
        sudo apt-get upgrade -y
        sudo apt-get install -y libseccomp-dev gnutls-bin

    - name: Install golangci lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15.0
        install-mode: binary
        install-only: true

    - name: Install gosec
      run: curl -sfL https://raw.githubusercontent.com/securego/gosec/master/install.sh | sh -s -- -b $(go env GOPATH)/bin ${GOSEC_VERSION}

    - name: Test
      run: |
        export PATH=$PATH:/usr/local/go/bin/
        make check

  e2e-helm:
    name: E2E Helm
    runs-on: ubuntu-latest
    env:
      KIND_CLUSTER_NAME: e2e
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'
        check-latest: true

    - name: Set up Helm
      uses: azure/setup-helm@v5.0.1
      with:
        version: v4.3.1

    - name: Create kind cluster
      uses: helm/kind-action@v1.15.1
      with:
        version: v0.33.0
        cluster_name: ${{ env.KIND_CLUSTER_NAME }}

    - name: Run helm e2e test
      run: make e2e-helm
