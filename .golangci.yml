version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            # Renaming e.g. keysync.KeySyncServer would change the API.
            - disableStutteringCheck
        - name: package-comments
        - name: var-naming
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
        - name: errorf
        - name: unused-parameter
        - name: unexported-return
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: var-declaration
        - name: context-keys-type
        - name: empty-block

formatters:
  enable:
    - gofmt
    - goimports
